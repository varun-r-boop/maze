<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Keybound</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070d; overflow: hidden; font-family: system-ui, Segoe UI, sans-serif; color: #e8e6f0; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,5,12,.88); overflow-y: auto; touch-action: auto; padding: 16px; box-sizing: border-box; }
  #overlay.hidden { display: none; }
  .panel { width: 100%; max-width: 620px; margin: auto; padding: 26px 28px; background: #14131f; border: 1px solid #2c2a40; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 38px; letter-spacing: 2px; }
  h1 span { color: #ffd54f; }
  h3 { margin: 0 0 8px; font-size: 16px; }
  .sub { color: #9a97b0; margin: 0 0 18px; }
  .note { color: #8f8ca6; font-size: 13px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #9a97b0; margin-bottom: 6px; }
  input { font: inherit; background: #0d0c16; color: #e8e6f0; border: 1px solid #3b3858; border-radius: 8px; padding: 9px 12px; width: 100%; box-sizing: border-box; }
  input.code { text-transform: uppercase; letter-spacing: 6px; font-weight: 700; text-align: center; margin-bottom: 10px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 8px; }
  @media (max-width: 520px) { .cols { grid-template-columns: 1fr; } }
  .card { background: #1b1a2a; border: 1px solid #2c2a40; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; }
  .card p { color: #9a97b0; font-size: 13px; margin: 0 0 12px; flex: 1; }
  button { font: inherit; background: #24223a; color: #e8e6f0; border: 1px solid #3b3858; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button.go { background: #7c4dff; border-color: #7c4dff; font-weight: 700; padding: 10px 22px; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #ff6e6e; min-height: 1.2em; margin: 8px 0 0; }
  .bigcode { font-size: 46px; font-weight: 800; letter-spacing: 10px; color: #ffd54f; margin: -6px 0 14px; }
  .linkrow { display: flex; gap: 8px; margin-bottom: 8px; }
  .plist { list-style: none; padding: 0; margin: 0 0 18px; }
  .plist li { padding: 7px 0; border-bottom: 1px solid #22203a; }
  .plist em { color: #8f8ca6; font-size: 12px; font-style: normal; margin-left: 6px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .result { font-size: 30px; font-weight: 800; margin: 0 0 8px; }
  ul.rules { padding-left: 18px; line-height: 1.55; color: #c9c6da; margin: 10px 0 0; font-size: 14px; }
  details summary { cursor: pointer; color: #b9b5d6; margin-top: 14px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
  .seg button { flex: 1; min-width: 110px; padding: 9px 10px; }
  .seg button.on { background: #3a2a7a; border-color: #7c4dff; color: #fff; font-weight: 700; }
  #c.mode3d { cursor: crosshair; }
  #exploreExit { position: fixed; left: 12px; top: 48px; z-index: 5; padding: 6px 12px; font-size: 13px; background: rgba(10,10,20,.88); border-color: #2c2a40; }
  #actBtn { position: fixed; right: 18px; bottom: 104px; z-index: 5; width: 92px; height: 92px; border-radius: 50%; padding: 0; font-size: 13px; font-weight: 800; letter-spacing: .5px; background: rgba(30,90,60,.55); border: 2px solid rgba(105,240,174,.6); color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  #actBtn.it { background: rgba(110,30,30,.55); border-color: rgba(255,82,82,.6); }
  #actBtn.ready { background: rgba(255,214,79,.85); border-color: #fff; color: #1a1400; }
  .seg.chars canvas { position: static; display: block; margin: 0 auto 4px; width: 96px; height: 84px; }
  /* hide clay: the sculpting screen */
  #sculpt { position: fixed; inset: 0; z-index: 5; }
  #sculpt.hidden { display: none; }
  #sculpt .sc-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #sculpt .sc-top, #sculpt .sc-bottom, #sculpt .sc-panel { position: absolute; background: rgba(16,15,26,.88); border: 1px solid #2c2a40; border-radius: 10px; padding: 8px 12px; box-sizing: border-box; }
  #sculpt .sc-top { top: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 15px; }
  #sculpt .sc-time { color: #ffe9a8; font-weight: 700; }
  #sculpt .sc-status { color: #9be7c4; }
  #sculpt .sc-panel { top: 56px; left: 10px; width: 228px; max-height: calc(100% - 130px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  #sculpt .sc-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #sculpt .sc-tools button { padding: 8px 6px; }
  #sculpt button.on { background: #3a2a7a; border-color: #7c4dff; color: #fff; font-weight: 700; }
  #sculpt label { margin: 0; }
  #sculpt input[type=range] { width: 100%; padding: 0; }
  #sculpt .sc-colors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  #sculpt .sc-colors button { height: 26px; padding: 0; border-radius: 6px; border: 2px solid rgba(0,0,0,.4); }
  #sculpt .sc-colors button.on { border-color: #fff; box-shadow: 0 0 0 2px #7c4dff; }
  #sculpt .sc-row { display: flex; gap: 6px; } #sculpt .sc-row button { flex: 1; padding: 7px 4px; }
  #sculpt .sc-bottom { bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; width: min(720px, calc(100% - 20px)); }
  #sculpt .sc-hint { flex: 1; color: #b9b5d6; font-size: 13px; }
  @media (max-width: 640px) {
    #sculpt .sc-panel { top: auto; bottom: 64px; left: 10px; right: 10px; width: auto; max-height: 40%; }
    #sculpt .sc-hint { display: none; } #sculpt .sc-bottom { justify-content: center; }
  }
  /* arena fights: the make-your-fighter screen, and the fight buttons on phones */
  #fbuild { position: fixed; inset: 0; z-index: 6; background: rgba(5,5,12,.92); overflow-y: auto; padding: 16px; box-sizing: border-box; touch-action: auto; }
  #fbuild.hidden { display: none; }
  #fbuild select { font: inherit; font-size: 13px; background: #0d0c16; color: #e8e6f0; border: 1px solid #3b3858; border-radius: 6px; padding: 5px; min-width: 0; }
  .fighter-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .fighter-row canvas { position: static; width: 120px; height: 137px; background: #1b1a2a; border: 1px solid #2c2a40; border-radius: 10px; }
  /* the character editor */
  .ce { display: flex; height: calc(100vh - 32px); max-width: 1400px; margin: auto; border-radius: 12px; overflow: hidden; border: 1px solid #2c3a50; }
  .ce-side { flex: 0 0 380px; background: #1a2232; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; box-sizing: border-box; }
  .ce-side h2 { text-align: center; letter-spacing: 2px; margin: 0 0 12px; font-size: 20px; }
  .ce-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .ce-tabs button { font-size: 11px; font-weight: 800; line-height: 1.15; padding: 5px 8px; background: transparent; border: 2px solid #cfd6e4; color: #cfd6e4; border-radius: 2px; }
  .ce-tabs button.on { background: #fff; color: #111; }
  .ce-parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; background: #151c29; padding: 8px; border-radius: 6px; margin-bottom: 12px; }
  .ce-parts button { padding: 7px 4px; font-size: 12px; font-weight: 700; background: #1f2838; border: 1px solid #2c3a50; color: #e8edf6; cursor: grab; touch-action: none; }
  .ce-parts button:hover { background: #26324a; } .ce-parts button.armed { border-color: #ffd54f; background: #3a3420; }
  .ce-prop { padding: 6px 12px; font-size: 13px; }
  .ce-label { font-size: 12px; letter-spacing: 1px; color: #b9c3d6; margin: 0 0 8px; }
  .ce-shapes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; background: #151c29; padding: 8px; border-radius: 6px; margin-bottom: 10px; }
  .ce-shapes button { aspect-ratio: 1; padding: 4px; background: #1f2838; border: 1px solid #2c3a50; border-radius: 4px; color: #e8edf6; cursor: grab; touch-action: none; }
  .ce-shapes button:hover { background: #26324a; } .ce-shapes button.armed { border-color: #ffd54f; background: #3a3420; }
  .ce-shapes svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .ce-colors { display: flex; flex-wrap: wrap; gap: 6px; background: #151c29; padding: 8px; border-radius: 6px; margin-bottom: 8px; align-items: center; }
  .ce-colors button { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid rgba(0,0,0,.4); }
  .ce-colors button.on { box-shadow: 0 0 0 2px #fff; }
  .ce-any { width: 28px; height: 24px; padding: 0; border: none; background: none; }
  .ce-row { display: flex; align-items: center; justify-content: space-between; background: #151c29; padding: 10px 12px; border-radius: 6px; margin: 0 0 6px; font-size: 15px; color: #e8edf6; letter-spacing: 1px; cursor: pointer; }
  .ce-row input[type=range] { width: 55%; padding: 0; } .ce-row input[type=checkbox] { width: 24px; height: 24px; accent-color: #43a047; }
  .ce-sel { margin: 6px 0; } .ce-selname { font-size: 13px; color: #b9c3d6; margin-bottom: 6px; }
  .ce-gizmo { display: flex; gap: 5px; flex-wrap: wrap; } .ce-gizmo button { flex: 1; padding: 6px; font-size: 13px; } .ce-gizmo button.on { background: #3a2a7a; border-color: #7c4dff; }
  .ce-tools { display: flex; gap: 6px; margin-top: auto; padding-top: 10px; } .ce-tools button { flex: 1; padding: 6px; font-size: 12px; }
  .ce-specials button { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 10px; }
  .ce-specials button span { display: block; font-size: 12px; color: #b9b5d6; margin-top: 4px; } .ce-specials button.on { background: #3a2a7a; border-color: #7c4dff; }
  .ce-foot { display: flex; gap: 8px; margin-top: 12px; } .ce-foot button { flex: 1; }
  .ce-view { flex: 1; position: relative; min-width: 0; } .ce-view canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .ce-hint { position: absolute; top: 10px; left: 12px; right: 12px; margin: 0; color: #d7e3f4; font-size: 13px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .ce-anim { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .ce-anim button { padding: 6px 12px; font-size: 13px; background: rgba(20,20,35,.8); }
  .ce-try { width: 100%; margin-top: 10px; padding: 10px; font-weight: 700; background: #2f6f3a; border-color: #43a047; }
  .ce.practicing .ce-side, .ce.practicing .ce-hint, .ce.practicing .ce-anim { display: none; }
  /* "Try it out": the practice room's overlay */
  .pr { position: absolute; inset: 0; pointer-events: none; color: #2a2d33; }
  .pr > * { pointer-events: auto; }
  .pr-top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 16px; justify-content: space-between; font: 700 12px system-ui; letter-spacing: 1px; pointer-events: none; }
  .pr-top > div { flex: 0 1 300px; background: rgba(255,255,255,.85); border-radius: 8px; padding: 6px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .pr-bar { height: 10px; background: #e3e4e8; border-radius: 5px; overflow: hidden; margin-top: 4px; } .pr-bar i { display: block; height: 100%; width: 100%; border-radius: 5px; }
  .pr-help { position: absolute; bottom: 10px; left: 12px; right: 170px; margin: 0; font: 13px system-ui; color: #4a4f58; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
  .pr-exit { position: absolute; bottom: 10px; right: 12px; background: #2a2d33; color: #fff; border-color: #2a2d33; font-weight: 700; }
  .pr-pop { position: absolute; transform: translate(-50%, -50%); font: 900 22px system-ui; text-shadow: 0 2px 0 #fff, 0 0 6px #fff; pointer-events: none; white-space: nowrap; }
  .pr-pad { position: absolute; right: 12px; bottom: 56px; display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
  .pr-pad button { height: 56px; border-radius: 12px; font-size: 11px; font-weight: 800; background: rgba(42,45,51,.85); color: #fff; touch-action: none; }
  @media (max-width: 760px) { .ce { flex-direction: column-reverse; height: auto; } .ce-view { height: 55vh; flex: none; } .ce-side { flex: none; } }
  #fpad { position: fixed; right: 12px; bottom: 90px; z-index: 4; display: none; grid-template-columns: repeat(3, 66px); gap: 8px; }
  #fpad button { height: 66px; border-radius: 50%; padding: 0; font-size: 11px; font-weight: 800; background: rgba(40,36,70,.75); border: 2px solid rgba(180,170,255,.5); color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
  #fpad button.ready { background: rgba(255,170,40,.85); border-color: #fff; color: #2a1400; }
  /* hide clay: the action button on phones (place / pick up) */
  #act { position: fixed; right: 18px; bottom: 96px; z-index: 4; width: 84px; height: 84px; border-radius: 50%; font-weight: 800; background: #7c4dff; border-color: #b39dff; display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<button id="exploreExit" hidden>← Lobby</button>
<button id="actBtn" hidden>TAG</button>
<div id="overlay"><div class="panel" id="panel"></div></div>
<div id="sculpt" class="hidden"></div>
<div id="fbuild" class="hidden"></div>
<div id="fpad"><button data-f="block">BLOCK</button><button data-f="special">SPECIAL</button><button data-f="dodge">DODGE</button><button data-f="kick">KICK</button><button data-f="punch" style="grid-column: span 2; border-radius: 33px">PUNCH</button></div>
<button id="act"></button>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }</script>
<script src="shared.js"></script>
<script type="module" src="client.js"></script>
</body>
</html>
